<p>HKJunkCall 於8月27日更新了伺服網站的認證，若出現未能連接伺服器問題，請更新至6月推出的 0.2.17 版本。</p>
而由於新伺服器使用<a href="https://en.wikipedia.org/wiki/Server_Name_Indication">SNI</a>，Android 2.3或以下版本因系統問題無法連接，因此無法再支援。<br>
